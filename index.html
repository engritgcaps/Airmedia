<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirMedia Slideshow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .slideshow {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .slide {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    animation: cycle 180s linear infinite;
  }

  /* Each slide offset by 30s (30/180 = 16.666...%) */
  .slide:nth-child(1) { background-image: url('https://i.imgur.com/S6qP2Mn.jpeg'); animation-delay: 0s; }
  .slide:nth-child(2) { background-image: url('https://i.imgur.com/yW013Cd.jpeg'); animation-delay: 30s; }
  .slide:nth-child(3) { background-image: url('https://i.imgur.com/LAWCMpj.jpeg'); animation-delay: 60s; }
  .slide:nth-child(4) { background-image: url('https://i.imgur.com/511BunM.jpeg'); animation-delay: 90s; }
  .slide:nth-child(5) { background-image: url('https://i.imgur.com/cqbNBSC.jpeg'); animation-delay: 120s; }
  .slide:nth-child(6) { background-image: url('https://i.imgur.com/DupsfJc.jpeg'); animation-delay: 150s; }

  @keyframes cycle {
    /*
      Total cycle = 180s (6 slides × 30s)
      Each slide is visible for 30s out of 180s = 16.666%
      Fade in over ~1s (0.555%), hold, fade out over ~1s (0.555%)
    */
    0%       { opacity: 0; }
    0.5%     { opacity: 1; }
    16.1%    { opacity: 1; }
    16.666%  { opacity: 0; }
    100%     { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="slideshow">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>
</body>
</html>
